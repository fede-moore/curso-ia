<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro diario de sesiones de estudio y seguimiento de rachas."
    />
    <title>Diario de Estudio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1>Diario de Estudio</h1>
      </header>

      <section
        class="panel stats-panel"
        aria-label="Rachas y progreso de estudio"
        aria-live="polite"
      >
        <div class="hero">
          <span class="hero-fire" aria-hidden="true">🔥</span>
          <p class="hero-figure">
            <span id="streak-count" class="hero-count">0</span>
            <span id="streak-unit" class="hero-unit">días</span>
          </p>
          <p class="hero-caption">Racha actual</p>
        </div>

        <dl class="stats-row">
          <div class="stat">
            <dt><span aria-hidden="true">🏆</span> Mejor racha</dt>
            <dd><span id="best-streak-count">0</span> <span id="best-streak-unit">días</span></dd>
          </div>
          <div class="stat">
            <dt><span aria-hidden="true">⏱️</span> Esta semana</dt>
            <dd><span id="week-minutes">0 min</span></dd>
          </div>
          <div class="stat">
            <dt><span aria-hidden="true">📅</span> Este mes</dt>
            <dd><span id="month-days">0</span> <span id="month-days-unit">días</span></dd>
          </div>
        </dl>
      </section>

      <section
        id="heatmap-panel"
        class="panel heatmap-panel"
        aria-label="Mapa de calor de días estudiados"
      >
        <h2>Últimas 12 semanas</h2>
        <div id="heatmap-grid" class="heatmap-grid"></div>
        <p class="heatmap-legend">
          <span class="legend-cell level-0" aria-hidden="true"></span>
          <span>Sin estudio</span>
          <span class="legend-sep" aria-hidden="true">·</span>
          <span>Menos</span>
          <span class="legend-cell level-1" aria-hidden="true"></span>
          <span class="legend-cell level-2" aria-hidden="true"></span>
          <span class="legend-cell level-3" aria-hidden="true"></span>
          <span class="legend-cell level-4" aria-hidden="true"></span>
          <span>Más</span>
          <span class="legend-sep" aria-hidden="true">·</span>
          <span class="legend-cell is-future" aria-hidden="true"></span>
          <span>día futuro</span>
        </p>
        <div id="heatmap-tooltip" class="heatmap-tooltip" aria-hidden="true" hidden></div>
      </section>

      <section class="panel form-panel">
        <form id="session-form" autocomplete="off">
          <div class="field">
            <label for="date">Fecha</label>
            <input id="date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="theme">Tema</label>
            <input
              id="theme"
              name="theme"
              type="text"
              maxlength="80"
              placeholder="Ej. Álgebra"
              required
            />
          </div>

          <div class="field">
            <label for="minutes">Minutos</label>
            <input
              id="minutes"
              name="minutes"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="45"
              required
            />
          </div>

          <button type="submit">Guardar sesión</button>
        </form>
      </section>

      <section class="panel sessions-panel">
        <h2>Sesiones</h2>
        <ul id="sessions-list" class="sessions-list"></ul>
      </section>
    </main>

    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
