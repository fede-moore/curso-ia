<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Registro diario de sesiones de estudio y seguimiento de rachas."
    />
    <title>Diario de Estudio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel form-panel">
        <h1>Diario de Estudio</h1>

        <form id="session-form" autocomplete="off">
          <div class="field">
            <label for="date">Fecha</label>
            <input id="date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="theme">Tema</label>
            <input
              id="theme"
              name="theme"
              type="text"
              maxlength="80"
              placeholder="Ej. Álgebra"
              required
            />
          </div>

          <div class="field">
            <label for="minutes">Minutos</label>
            <input
              id="minutes"
              name="minutes"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="45"
              required
            />
          </div>

          <button type="submit">Guardar sesión</button>
        </form>
      </section>

      <section
        class="panel streak-panel"
        aria-label="Rachas de estudio"
        aria-live="polite"
      >
        <div class="streak-metrics">
          <div class="streak-metric">
            <p class="panel-label">Racha actual</p>
            <div class="streak-row">
              <span class="fire" aria-hidden="true">🔥</span>
              <span id="streak-count" class="streak-count">0</span>
            </div>
            <p id="streak-unit" class="streak-unit">días</p>
          </div>
          <div class="streak-metric best-streak">
            <p class="panel-label">Mejor racha</p>
            <div class="streak-row">
              <span class="trophy" aria-hidden="true">🏆</span>
              <span id="best-streak-count" class="streak-count best-streak-count">0</span>
            </div>
            <p id="best-streak-unit" class="streak-unit">días</p>
          </div>
        </div>
      </section>

      <section class="panel sessions-panel">
        <h2>Sesiones</h2>
        <ul id="sessions-list" class="sessions-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
